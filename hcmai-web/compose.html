    <header class="topbar"><div class="brand-wrap"><div class="brand-mark">H</div><div class="brand-copy"><span class="brand-name">HCMAI</span><span class="brand-tag">Hindustani Classical Music</span></div></div><nav class="main-nav" aria-label="Main navigation"><a href="index.html" class="nav-item">Home</a><a href="raag-explorer.html" class="nav-item">Raag Explorer</a><a href="thaat-explorer.html" class="nav-item">Thaat Explorer</a><a href="lessons.html" class="nav-item">Lessons</a><a href="compose.html" class="nav-item active">Compose</a><a href="practice.html" class="nav-item">Practice</a><a href="about.html" class="nav-item">About</a></nav><button class="auth-button primary-btn small" type="button">Log in</button></header>
    <main class="page-shell narrow-shell"><section class="section-surface composer"><label class="composer-title"><span>Bandish title</span><input id="notationTitle" placeholder="Enter Bandish Title..." /></label><div id="notationOutput" class="notation-output">Tap a Swara to start...</div><div class="modifier-controls"><div class="modifier-group"><span class="modifier-label">Octave</span><div class="glass-slider" id="octave" role="radiogroup" aria-label="Octave"><button type="button" data-value="lower">Lower</button><button type="button" data-value="middle" class="active">Middle</button><button type="button" data-value="upper">Upper</button></div></div><div class="modifier-group"><span class="modifier-label">Pitch</span><div class="glass-slider" id="pitch" role="radiogroup" aria-label="Pitch"><button type="button" data-value="shuddha" class="active">Shuddha</button><button type="button" data-value="komal">Komal</button><button type="button" data-value="tivra">Tivra</button></div></div></div><div class="swara-grid" id="swaraGrid"></div><div class="structure-row"><button type="button" data-token="|">|</button><button type="button" data-token="x">x</button><button type="button" data-token="2">2</button><button type="button" data-token="0">0</button><button type="button" data-token="3">3</button><button type="button" data-token="4">4</button><button type="button" data-token="\n">↵</button></div><div class="composer-actions"><button id="deleteNotation" class="secondary-btn small" type="button">Delete</button><button id="clearNotation" class="secondary-btn small" type="button">Clear all</button><button id="printNotation" class="primary-btn small" type="button">Generate PDF</button></div></section></main><article class="print-document" aria-hidden="true"><h1 id="printTitle">Untitled Bandish</h1><div id="notationPrintContent"></div></article>
