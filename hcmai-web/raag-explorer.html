<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HCMAI" />
    <title>Raag Explorer | HCMAI</title>
    <meta name="description" content="Browse raags by mood, time, thaat, and personality in the HCMAI Raag Explorer." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="raag-explorer">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">H</div>
        <div class="brand-copy">
          <span class="brand-name">HCMAI</span>
          <span class="brand-tag">Hindustani Classical Music</span>
        </div>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-item">Home</a>
        <a href="raag-explorer.html" class="nav-item active">Raag Explorer</a>
        <a href="thaat-explorer.html" class="nav-item">Thaat Explorer</a>
        <a href="lessons.html" class="nav-item">Lessons</a>
        <a href="compose.html" class="nav-item">Compose</a>
        <a href="practice.html" class="nav-item">Practice</a>
        <a href="about.html" class="nav-item">About</a>
      </nav>

      <button class="auth-button primary-btn small" type="button">Log in</button>
    </header>

    <main class="page-shell narrow-shell">
      <section class="section-surface hero-inline">
        <div class="section-head">
          <div>
            <p class="eyebrow">Discover</p>
            <h1>Raag Explorer</h1>
          </div>
          <div class="inline-actions">
            <button class="secondary-btn small admin-only" type="button" data-admin-only>+ Add Raag</button>
            <button id="importRaagsButton" class="secondary-btn small admin-only" type="button" data-admin-only>Import JSON</button>
            <button id="exportRaagsButton" class="secondary-btn small admin-only" type="button" data-admin-only>Export JSON</button>
            <button id="importRaagSourcesButton" class="secondary-btn small admin-only" type="button" data-admin-only>Import source data</button>
            <button id="exportRaagSourcesButton" class="secondary-btn small admin-only" type="button" data-admin-only>Export source data</button>
            <a class="secondary-btn small admin-only" href="data-lab.html" data-admin-only>Composition Data Lab</a>
            <input id="importRaagsFile" type="file" accept="application/json,.json" hidden />
            <input id="importRaagSourcesFile" type="file" accept="application/json,.json" hidden />
          </div>
        </div>

        <div class="toolbar-block">
          <label class="search-box">
            <span>Search Raags</span>
            <input id="raagSearch" type="search" placeholder="Name, alias, swara, thaat, or Pakad" />
          </label>

          <form id="raagFilterForm" class="raag-filter-form">
            <label>
              <span>Record status</span>
              <select id="raagStatusFilter">
                <option value="all">All accessible records</option>
                <option value="published">Published</option>
                <option value="draft">Source candidates</option>
              </select>
            </label>
            <label>
              <span>Jati</span>
              <select id="raagJatiFilter">
                <option value="">Any</option>
                <option value="Sampurna">Sampurna</option>
                <option value="Shadav">Shadav</option>
                <option value="Audav">Audav</option>
                <option value="Vakra">Vakra</option>
              </select>
            </label>
            <label>
              <span>Thaat</span>
              <select id="raagThaatFilter">
                <option value="">Any</option>
              </select>
            </label>
            <label>
              <span>Time</span>
              <select id="raagTimeFilter">
                <option value="">Any</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
              </select>
            </label>
            <button class="primary-btn small" type="submit">Search Raags</button>
          </form>
          <p id="raagStatus" class="raag-status" role="status" aria-live="polite">Loading the live raag library...</p>
        </div>
      </section>

      <section class="card-grid three-up explorer-grid" id="raagGrid">
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <strong>HCMAI</strong>
        <span>Learn Hindustani Classical Music</span>
      </div>
      <nav>
        <a href="about.html">About</a>
        <a href="lessons.html">Lessons</a>
        <a href="practice.html">Practice</a>
      </nav>
    </footer>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="index.html" class="bottom-item"><span>Home</span></a>
      <a href="raag-explorer.html" class="bottom-item active"><span>Raags</span></a>
      <a href="thaat-explorer.html" class="bottom-item"><span>Thaats</span></a>
      <a href="compose.html" class="bottom-item"><span>Compose</span></a>
      <a href="lessons.html" class="bottom-item"><span>Lessons</span></a>
      <a href="practice.html" class="bottom-item"><span>Practice</span></a>
    </nav>

    <script src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/learn.js?v=20261004-raag-catalog-v2"></script>
  </body>
</html>
