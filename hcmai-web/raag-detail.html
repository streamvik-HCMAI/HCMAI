<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Raag Details | HCMAI</title>
    <meta name="description" content="Explore a Raag's structured details and source information." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css?v=20261006-raagedit" />
  </head>
  <body data-page="raag-detail">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">H</div>
        <div class="brand-copy">
          <span class="brand-name">HCMAI</span>
          <span class="brand-tag">Hindustani Classical Music</span>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-item">Home</a>
        <a href="raag-explorer.html" class="nav-item active">Raag Explorer</a>
        <a href="thaat-explorer.html" class="nav-item">Thaat Explorer</a>
        <a href="lessons.html" class="nav-item">Lessons</a>
        <a href="compose.html" class="nav-item">Compose</a>
        <a href="practice.html" class="nav-item">Practice</a>
        <a href="about.html" class="nav-item">About</a>
      </nav>
      <button class="auth-button primary-btn small" type="button">Log in</button>
    </header>

    <main class="page-shell narrow-shell raag-detail-page">
      <a class="text-link raag-detail-back" href="raag-explorer.html">Back to Raag Explorer</a>
      <section class="section-surface raag-detail-hero">
        <p id="raagDetailStatus" class="raag-status" role="status" aria-live="polite">Loading Raag record...</p>
        <div id="raagDetailContent" hidden>
          <div class="raag-detail-heading">
            <div>
              <p class="eyebrow" id="raagRecordStatus"></p>
              <h1 id="raagDetailName"></h1>
              <p id="raagDetailSummary" class="raag-detail-summary"></p>
            </div>
            <div id="raagDetailAdminActions" class="inline-actions admin-only raag-detail-admin-actions" data-admin-only>
              <button id="editRaagDetails" class="secondary-btn small" type="button">Edit fields</button>
              <button id="saveRaagDraft" class="secondary-btn small" type="button" hidden>Save as draft</button>
              <button id="publishRaag" class="primary-btn small" type="button" hidden>Publish verified Raag</button>
              <button id="cancelRaagEdit" class="secondary-btn small" type="button" hidden>Cancel</button>
            </div>
          </div>
          <p id="raagDetailFeedback" class="raag-status" role="status" aria-live="polite"></p>
          <section id="raagPublicDetails" class="raag-detail-content"></section>
          <form id="raagAdminForm" class="raag-admin-form" hidden></form>
          <details class="raag-provenance">
            <summary>Source and verification</summary>
            <dl id="raagProvenanceFacts" class="raag-detail-facts"></dl>
          </details>
          <section class="raag-recordings">
            <div class="section-head">
              <h2>Recordings and topics</h2>
              <button id="addRaagTopic" class="secondary-btn small admin-only" data-admin-only type="button">Add recording</button>
            </div>
            <p id="raagTopicsStatus" class="raag-status">Loading recordings...</p>
            <div id="raagTopicsList" class="topic-list"></div>
            <form id="raagTopicForm" class="raag-admin-form raag-topic-form" hidden>
              <label class="raag-edit-field"><span>Topic</span><select name="title"><option>Intro</option><option>Alankars</option><option>Palta</option><option>Sargam Geet</option><option>Bandish</option><option>Tarana</option></select></label>
              <label class="raag-edit-field"><span>Description</span><textarea name="text" rows="3"></textarea></label>
              <label class="raag-edit-field"><span>Audio MP3</span><input name="audio" type="file" accept="audio/mpeg" required /></label>
              <label class="raag-edit-field"><span>Order</span><input name="orderIndex" type="number" min="1" max="100" value="1" required /></label>
              <label class="check-row"><input name="requiresLogin" type="checkbox" checked /><span>Require login to play</span></label>
              <div class="inline-actions"><button class="primary-btn small" type="submit">Upload recording</button><button id="cancelRaagTopic" class="secondary-btn small" type="button">Cancel</button></div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div><strong>HCMAI</strong><span>Learn Hindustani Classical Music</span></div>
    </footer>
    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="index.html" class="bottom-item"><span>Home</span></a>
      <a href="raag-explorer.html" class="bottom-item active"><span>Raags</span></a>
      <a href="thaat-explorer.html" class="bottom-item"><span>Thaats</span></a>
      <a href="compose.html" class="bottom-item"><span>Compose</span></a>
      <a href="lessons.html" class="bottom-item"><span>Lessons</span></a>
      <a href="practice.html" class="bottom-item"><span>Practice</span></a>
    </nav>
    <script src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/raag-detail.js?v=20261006-v2"></script>
  </body>
</html>
